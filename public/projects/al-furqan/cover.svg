<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Librairie Al Furqan — product flow diagram: catalogue to cart to WhatsApp checkout">
  <rect width="1200" height="760" fill="#F4EEE1"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1E5B3F"/>

  <text x="64" y="70" font-family="ui-monospace, monospace" font-size="17" letter-spacing="2.5" fill="#1E5B3F">LIBRAIRIE AL FURQAN — FLOW DIAGRAM</text>
  <text x="64" y="118" font-family="Georgia, serif" font-size="40" fill="#20180F">Catalogue → Cart → WhatsApp</text>

  <!-- 1. catalogue -->
  <g>
    <rect x="64" y="176" width="360" height="424" rx="4" fill="#EDE4D2" stroke="#C9BC9E"/>
    <text x="84" y="210" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.5" fill="#7A6A4A">01 · CATALOGUE</text>
    <g>
      <rect x="84" y="228" width="150" height="164" rx="3" fill="#1E5B3F"/>
      <rect x="250" y="228" width="150" height="164" rx="3" fill="#2C6A4B"/>
      <rect x="84" y="408" width="150" height="164" rx="3" fill="#3A7A59"/>
      <rect x="250" y="408" width="150" height="164" rx="3" fill="#1E5B3F"/>
      <g fill="#D9B65B">
        <rect x="100" y="252" width="118" height="6"/><rect x="100" y="268" width="90" height="6"/>
        <rect x="266" y="252" width="118" height="6"/><rect x="266" y="268" width="90" height="6"/>
        <rect x="100" y="432" width="118" height="6"/><rect x="100" y="448" width="90" height="6"/>
        <rect x="266" y="432" width="118" height="6"/><rect x="266" y="448" width="90" height="6"/>
      </g>
    </g>
    <text x="84" y="596" font-family="ui-monospace, monospace" font-size="11" fill="#7A6A4A">search · filters · Qur'an attributes</text>
  </g>

  <path d="M448 388 h60 m-16 -14 l16 14 l-16 14" fill="none" stroke="#20180F" stroke-width="2"/>

  <!-- 2. cart -->
  <g>
    <rect x="532" y="240" width="300" height="296" rx="4" fill="#FFFFFF" stroke="#C9BC9E"/>
    <text x="552" y="274" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.5" fill="#7A6A4A">02 · CART</text>
    <g fill="#EDE4D2">
      <rect x="552" y="292" width="260" height="52" rx="3"/>
      <rect x="552" y="356" width="260" height="52" rx="3"/>
      <rect x="552" y="420" width="260" height="52" rx="3"/>
    </g>
    <g fill="#20180F" font-family="ui-monospace, monospace" font-size="12">
      <text x="566" y="323">Item · qty 1</text>
      <text x="566" y="387">Item · qty 2</text>
      <text x="566" y="451">Item · qty 1</text>
    </g>
    <rect x="552" y="488" width="260" height="30" rx="3" fill="#1E5B3F"/>
    <text x="682" y="508" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#F4EEE1">CHECKOUT →</text>
  </g>

  <path d="M856 388 h60 m-16 -14 l16 14 l-16 14" fill="none" stroke="#20180F" stroke-width="2"/>

  <!-- 3. whatsapp -->
  <g>
    <rect x="940" y="240" width="196" height="296" rx="16" fill="#FFFFFF" stroke="#C9BC9E"/>
    <rect x="940" y="240" width="196" height="34" rx="16" fill="#1E5B3F"/>
    <text x="1038" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#F4EEE1">03 · WHATSAPP</text>
    <rect x="958" y="292" width="140" height="44" rx="10" fill="#E7F0E7"/>
    <rect x="978" y="352" width="140" height="44" rx="10" fill="#EDE4D2"/>
    <rect x="958" y="412" width="110" height="44" rx="10" fill="#E7F0E7"/>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#5A5040">
      <text x="970" y="319">Order: 4 items</text>
      <text x="990" y="379">Deliver to…?</text>
      <text x="970" y="439">Confirmed ✓</text>
    </g>
  </g>

  <line x1="64" y1="640" x2="1136" y2="640" stroke="#C9BC9E"/>
  <text x="64" y="678" font-family="ui-monospace, monospace" font-size="13" fill="#5A5040">Mobile-first · ~25,240 Senegalese localities structured · La Poste network mapped</text>
  <text x="64" y="704" font-family="ui-monospace, monospace" font-size="12" fill="#8A7C5C">Next.js · TypeScript · Tailwind · Supabase — code complete, deployed</text>
</svg>
